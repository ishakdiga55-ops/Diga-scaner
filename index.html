<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>CheckDiga - فحص السيارات</title>
<meta name="theme-color" content="#0f172a">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-10">

<div class="bg-blue-900/30 border-b border-blue-600/50 px-3 py-2 text-center text-xs text-blue-200">
<i class="fa-solid fa-info-circle"></i> فحص السيارات من هاتفك
</div>

<div class="max-w-2xl mx-auto p-4">

<div class="text-center py-6">
<div class="w-16 h-16 mx-auto bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mb-3">
<i class="fa-solid fa-wrench text-white text-2xl"></i>
</div>
<h1 class="text-2xl font-extrabold">CheckDiga</h1>
<p class="text-gray-400 text-sm">أداة فحص السيارات</p>
<div id="count" class="text-xs text-gray-500 mt-2">جاري التحميل...</div>
</div>

<div class="bg-gray-800 rounded-2xl p-4 mb-4">
<div class="flex items-center gap-3 mb-3">
<div id="dot" class="w-3 h-3 rounded-full bg-red-500"></div>
<div class="flex-1">
<p id="status" class="font-bold text-red-400 text-sm">غير متصل</p>
<p class="text-xs text-gray-500">VIN: --</p>
</div>
</div>
<div class="grid grid-cols-3 gap-2 mb-2">
<button id="btBtn" class="bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold text-sm">
<i class="fa-brands fa-bluetooth-b"></i> Bluetooth
</button>
<button id="usbBtn" class="bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-bold text-sm">
<i class="fa-solid fa-usb"></i> USB
</button>
<button id="demoBtn" class="bg-amber-600 hover:bg-amber-700 py-3 rounded-xl font-bold text-sm">
<i class="fa-solid fa-flask"></i> تجريبي
</button>
</div>
<button id="disconnectBtn" class="hidden w-full bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold text-sm mb-2">
<i class="fa-solid fa-plug-circle-xmark.json"></i> قطع الاتصال
</button>
<button'
 id="clearBtn" class="];

w-full bg-red-700 hoverlog:bg-red-800 py-3 rounded('-xl font-bold text-sm">
<i class="fa-solid fa-trash"></i> مسح الأعطال
</button>
<div class="mt-3 bg-blue-900/40 border border-blue-600 rounded-xl p-3 text-xs text-blue-200 leading-relaxed">
<i class="fa-solid fa-mobile-screen-button"></i> على iPhone: حمّل متصفح <b>Bluefy</b> لتفعيل Bluetooth
</div>
</div>

<div class="bg-gray-800 rounded-2xl p-4">
<div class="flex items-center justify-between mb-3">
<h3 class="font-bold flex items-center gap-2">
<i class="fa-solid fa-triangle-exclamation text-red-400"></i> النتائج
</h3>
<span id="hc" class="text-sm font-bold text-gray-400">--</span>
</div>
<div id="list" class="text-sm text-gray-500 text-center py-4">اضغط "تجريبي" للبدء</div>
</div>

<div class="bg-gray-800 rounded-2xl p-4 mt-4">
<h3 class="font-bold mb-3">
<i class="fa-solid fa-search text-blue-400"></i> ابحث عن كود
</h3>
<input id="search" type="text" class="w-full bg-gray-900 border-2 border-gray-700 focus:border-blue-500 rounded-xl px-3 py-2.5 outline-none text-sm" placeholder="مثال: P0301, C0035, U0100">
<div id="results" class="mt-3"></div>
</div>

<div id="log" class="bg-black text-green-400 p-3 rounded-xl font-mono text-xs mt-4 max-h-32 overflow-y-auto" style="unicode-bidi:plaintext;text-align:start;white-space:pre-wrap;">> مرحباً!</div>

</div>

<footer class="text-center py-6 text-xs text-gray-600 border-t border-gray-800 mt-8">
<div class="flex items-center justify-center gap-2 mb-2">
<div class="w-6 h-6 bg-gradient-to-br from-blue-500 to-purple-600 rounded flex items-center justify-center">
<i class="fa-solid fa-wrench text-white text-xs"></i>
</div>
<span class="font-extrabold text-gray-300">CheckDiga</span>
</div>
صُنع في الجزائر 2026
</footer>

<script>
var DB = {};
var isDemo = false;
var isConnected = false;

function log(m){
  var c = document.getElementById('log');
  if(!c) return;
  var t = new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  c.textContent += '\n[' + t + '] ' + m;
  c.scrollTop = c.scrollHeight;
}

function setStatus(s){
  var d = document.getElementById('dot');
  var st = document.getElementById('status');
  var db = document.getElementById('disconnectBtn');
  var bt = document.getElementById('btBtn');
  var usb = document.getElementById('usbBtn');
  var demo = document.getElementById('demoBtn');
  
  if(s === 'demo'){
    d.className = 'w-3 h-3 rounded-full bg-amber-500';
    st.textContent = 'وضع تجريبي';
    st.className = 'font-bold text-amber-400 text-sm';
    bt.classList.add('hidden');
    usb.classList.add('hidden');
    demo.classList.add('hidden');
    db.classList.remove('hidden');
  } else if(s === 'connected'){
    d.className = 'w-3 h-3 rounded-full bg-green-500';
    st.textContent = 'متصل';
    st.className = 'font-bold text-green-400 text-sm';
    bt.classList.add('hidden');
    usb.classList.add('hidden');
    demo.classList.add('hidden');
    db.classList.remove('hidden');
  } else {
    d.className = 'w-3 h-3 rounded-full bg-red-500 animate-pulse';
    st.textContent = 'غير متصل';
    st.className = 'font-bold text-red-400 text-sm';
    bt.classList.remove('hidden');
    usb.classList.remove('hidden');
    demo.classList.remove('hidden');
    db.classList.add('hidden');
  }
}

// ============ تحميل كل ملفات JSON ============
var files = [
  'dtc_core.json',
  'dtc_p.json',
  'dtc_u.json',
  'dtc_b.json',
  'dtc_c.json',
  'dtc_full.json',
  'dtc_modern.json',
  'dtc_details.json',
  'dtc_chineseINFO: جاري تحميل الأكواد...');

Promise.all(files.map(function(f){
  return fetch(f + '?v=' + Date.now())
    .then(function(r){
      if(r.ok){
        log('OK: ' + f);
        return r.json();
      }
      return {};
    })
    .catch(function(){
      log('INFO: ' + f + ' غير موجود');
      return {};
    });
})).then(function(results){
  results.forEach(function(data){
    for(var k in data){
      if(!DB[k]) DB[k] = data[k];
    }
  });
  var n = Object.keys(DB).length;
  document.getElementById('count').textContent = n + ' كود جاهز للفحص';
  log('OK: ================');
  log('OK: ' + n + ' كود محمّل بنجاح!');
  log('INFO: اضغط "تجريبي" للبدء');
}).catch(function(e){
  log('ERR: ' + e.message);
});

// ============ زر تجريبي ============
document.getElementById('demoBtn').onclick = function(){
  if(Object.keys(DB).length === 0){
    alert('انتظر تحميل الأكواد...');
    return;
  }
  isDemo = true;
  isConnected = true;
  setStatus('demo');
  log('OK: وضع تجريبي نشط - ' + Object.keys(DB).length + ' كود');
  
  var demoFaults = [
    {code:'P0301', type:'مؤكد', system:'المحرك'},
    {code:'P0171', type:'مؤكد', system:'المحرك'},
    {code:'P0299', type:'مؤكد', system:'المحرك'},
    {code:'P0420', type:'مؤقت', system:'العوادم'},
    {code:'U0100', type:'مؤكد', system:'الكهرباء'}
  ];
  renderFaults(demoFaults);
};

// ============ زر Bluetooth ============
document.getElementById('btBtn').onclick = function(){
  if(!navigator.bluetooth){
    alert('Bluetooth غير مدعوم على هذا المتصفح.\n\n📱 على iPhone: استخدم متصفح Bluefy\n💻 على الكمبيوتر: استخدم Chrome\n📱 على أندرويد: استخدم Chrome');
    return;
  }
  log('INFO: Bluetooth مدعوم على هذا المتصفح');
  alert('Bluetooth مدعوم!\n\nلتوصيل قطعة ELM327:\n1. شغّل القطعة في السيارة\n2. اضغط Bluetooth مرة أخرى\n3. اختر الجهاز من القائمة');
  // هنا يمكن إضافة كود الاتصال الحقيقي بـ Web Bluetooth
};

// ============ زر USB ============
document.getElementById('usbBtn').onclick = function(){
  if(!navigator.serial){
    alert('USB Serial غير مدعوم.\n\nاستخدم Chrome على الحاسوب أو أندرويد.');
    return;
  }
  log('INFO: USB Serial مدعوم');
  alert('USB مدعوم!\n\nلتوصيل قطعة ELM327:\n1. وصّل القطعة بالحاسوب\n2. اضغط USB مرة أخرى\n3. اختر المنفذ');
};

// ============ زر قطع الاتصال ============
document.getElementById('disconnectBtn').onclick = function(){
  isDemo = false;
  isConnected = false;
  setStatus('x');
  document.getElementById('list').innerHTML = '<p class="text-gray-500 text-center py-4">تم قطع الاتصال</p>';
  document.getElementById('hc').textContent = '--';
  log('INFO: تم قطع الاتصال');
};

// ============ زر مسح الأعطال ============
document.getElementById('clearBtn').onclick = function(){
  if(!isConnected && !isDemo){
    alert('غير متصل');
    return;
  }
  if(!confirm('هل أنت متأكد من مسح الأعطال؟')) return;
  document.getElementById('list').innerHTML = '<p class="text-green-400 text-center py-4">تم المسح بنجاح</p>';
  document.getElementById('hc').textContent = '--';
  log('OK: تم مسح الأعطال');
};

// ============ عرض الأعطال ============
function renderFaults(faults){
  var list = document.getElementById('list');
  var totalScore = 100;
  var h = '';
  
  faults.forEach(function(f){
    var info = DB[f.code] || {};
    var title = info.t || info.title || 'عطل';
    var sev = info.s || info.severity || 'medium';
    
    // خصم من الصحة
    var c = f.code.toUpperCase();
    if(c.indexOf('P0') === 0) totalScore -= 2;
    else if(c.indexOf('P1') === 0 || c.indexOf('P2') === 0 || c.indexOf('P3') === 0) totalScore -= 2.5;
    else if(c[0] === 'C') totalScore -= 3;
    else if(c[0] === 'B') totalScore -= 4;
    else if(c[0] === 'U') totalScore -= 5;
    
    var color = sev === 'critical' ? '#dc2626' : sev === 'high' ? '#f97316' : sev === 'medium' ? '#f59e0b' : '#10b981';
    
    h += '<div class="bg-red-900/30 border-r-4 rounded-xl p-3 mb-2" style="border-color:' + color + '">';
    h += '<div class="flex items-center gap-2 mb-1 flex-wrap">';
    h += '<span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded">' + (f.system || 'المحرك') + '</span>';
    h += '<span class="font-mono font-bold text-red-300">' + f.code + '</span>';
    h += '<span class="text-xs bg-gray-700 text-white px-2 py-0.5 rounded">' + f.type + '</span>';
    h += '</div>';
    h += '<div class="text-xs text-gray-300">' + title + '</div>';
    h += '</div>';
  });
  
  totalScore = Math.max(25, Math.min(100, Math.round(totalScore)));
  
  list.innerHTML = h;
  document.getElementById('hc').textContent = 'الصحة: ' + totalScore + '/100';
}

// ============ البحث ============
document.getElementById('search').addEventListener('input', function(e){
  var q = e.target.value.trim().toUpperCase();
  var div = document.getElementById('results');
  if(q.length < 2){
    div.innerHTML = '';
    return;
  }
  if(Object.keys(DB).length === 0){
    div.innerHTML = '<p class="text-gray-500 text-sm text-center">الأكواد لم تُحمّل بعد</p>';
    return;
  }
  
  var found = [];
  for(var code in DB){
    var info = DB[code];
    var title = (info.t || info.title || '').toString();
    var titleEn = (info.e || info.title_en || '').toString();
    if(code.indexOf(q) >= 0>';
 || title.indexOf(e.target.value) >= 0 || titleEn.toUpperCase().indexOf(q) >= 0){
      found.push([code, info]);
      if(found.length >= 30) break;
    }
  }
  
  if(found.length === 0){
    div.innerHTML = '<p class="text-gray-500 text-sm text-center py-2">لا نتائج</p>';
    return;
  }
  
  var h = '<div class="space-y-1">';
  found.forEach(function(x){
    var code = x[0], info = x[1];
    var title = info.t || info.title || 'عطل';
    var sev = info.s || info.severity || 'medium';
    var color = sev === 'critical' ? 'bg-red-600' : sev === 'high' ? 'bg-orange-600' : sev === 'medium' ? 'bg-amber-600' : 'bg-green-600';
    h += '<div class="bg-gray-900 rounded-lg p-2 text-sm flex justify-between items-center gap-2">';
    h += '<div><span class="font-mono text-red-300 font-bold">' + code + '</span> - ' + title + '</div>';
    h += '<span class="text-xs ' + color + ' text-white px-2 py-0.5 rounded whitespace-nowrap">' + sev + '</span>';
    h += '</div  });
  h += '</div>';
  div.innerHTML = h;
});

// ============ تشغيل ============
setStatus('x');
log('INFO: اضغط "تجريبي" للبدء');
</script>
</body>
</html>
