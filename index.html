  var K=Object.keys(FR).sort(function(a,b){return b.length-a.length});
function ts(t){
  if(!t||typeof t!=='string')return t;
  if(!/[\u0600-\u06FF]/.test(t))return t;
  if(FR[t])return FR[t];
  for(var i=0;i<K.length;i++){var k=K[i];if(k.length>2&&t.indexOf(k)>=0)t=t.split(k).join(FR[k])}
  return t;
}
function tn(n){
  if(n.nodeType===3){var s=ts(n.nodeValue);if(s!==n.nodeValue)n.nodeValue=s}
  else if(n.nodeType===1){
    var tag=n.tagName;
    if(tag==='SCRIPT'||tag==='STYLE'||tag==='CODE'||tag==='PRE')return;
    if(n.id==='console')return;
    if(n.placeholder)n.placeholder=ts(n.placeholder);
    if(n.title)n.title=ts(n.title);
    for(var i=0;i<n.childNodes.length;i++)tn(n.childNodes[i]);
  }
}
var busy=0;
function tAll(){
  if(busy)return;
  if(localStorage.getItem('checkdiga_lang')!=='fr')return;
  busy=1;try{tn(document.body)}catch(e){}busy=0;
}
function addBtn(){
  if(document.getElementById('btnLangSwitch'))return;
  var th=document.getElementById('btnTheme');
  if(!th||!th.parentNode)return;
  var b=document.createElement('button');
  b.id='btnLangSwitch';b.type='button';
  b.className='bg-gray-800 border-2 border-blue-500 text-blue-400 px-3 py-2 rounded-xl text-sm font-bold';
  b.innerHTML=localStorage.getItem('checkdiga_lang')==='fr'?'ع':'FR';
  b.onclick=function(){
    localStorage.setItem('checkdiga_lang',localStorage.getItem('checkdiga_lang')==='fr'?'ar':'fr');
    location.reload();
  };
  th.parentNode.insertBefore(b,th);
}
function obs(){
  if(localStorage.getItem('checkdiga_lang')!=='fr')return;
  if(window.__obsOn)return;window.__obsOn=1;
  var tm=null;
  new MutationObserver(function(){
    if(tm)clearTimeout(tm);
    tm=setTimeout(tAll,80);
  }).observe(document.body,{childList:true,subtree:true,characterData:true});
}
function boot(){
  addBtn();
  if(localStorage.getItem('checkdiga_lang')==='fr'){
    document.documentElement.lang='fr';
    document.documentElement.dir='ltr';
    tAll();
    setTimeout(tAll,300);
    setTimeout(tAll,800);
    setTimeout(tAll,2000);
    setTimeout(tAll,4000);
    obs();
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
setTimeout(boot,1000);
setTimeout(boot,3000);
})();
