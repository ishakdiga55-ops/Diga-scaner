<!-- 🦅 عين الصقر - أداة اصطياد الأخطاء (Debug Tool) -->
<div id="eagleEye" style="display:none; position:fixed; top:0; left:0; right:0; max-height:40vh; overflow-y:auto; background:#dc2626; color:#fff; z-index:999999; font-family:monospace; font-size:12px; padding:10px; direction:ltr; text-align:left; border-bottom:3px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
  <div style="font-weight:bold; margin-bottom:5px; font-size:14px; color:#fef08a;">🦅 Eagle Eye Debugger:</div>
  <div id="eagleEyeContent"></div>
</div>

<script>
(function() {
  var box = document.getElementById('eagleEye');
  var content = document.getElementById('eagleEyeContent');
  var hasErrors = false;

  function logError(msg) {
    hasErrors = true;
    box.style.display = 'block';
    var div = document.createElement('div');
    div.style.borderBottom = '1px solid rgba(255,255,255,0.3)';
    div.style.padding = '4px 0';
    div.textContent = '❌ ' + msg;
    content.appendChild(div);
  }

  // 1. اصطياد أخطاء الجافاسكريبت (JavaScript Errors)
  window.onerror = function(msg, url, line, col, error) {
    logError('JS Error: ' + msg + ' | Line: ' + line + ' | File: ' + url.split('/').pop());
    return false;
  };

  // 2. اصطياد الوعود المرفوضة (Unhandled Promises)
  window.addEventListener('unhandledrejection', function(e) {
    logError('Promise Error: ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown'));
  });

  // 3. فحص تحميل ملفات CSS والصور (Resource Errors)
  window.addEventListener('error', function(e) {
    if (e.target && (e.target.tagName === 'LINK' || e.target.tagName === 'SCRIPT' || e.target.tagName === 'IMG')) {
      logError('Failed to load: ' + e.target.tagName + ' -> ' + e.target.src || e.target.href);
    }
  }, true); // استخدام true ضروري لاصطياد أخطاء تحميل الملفات

  // 4. فحص خاص لملفات CSS بعد تحميل الصفحة
  window.addEventListener('load', function() {
    setTimeout(function() {
      document.querySelectorAll('link[rel="stylesheet"]').forEach(function(link) {
        if (!link.sheet) {
          logError('CSS Failed: ' + link.href.split('/').pop());
        }
      });
    }, 1000);
  });

  console.log("🦅 Eagle Eye is watching...");
})();
</script>
<!-- 🦅 نهاية عين الصقر -->
