<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CheckDiga Pro — فحص السيارات</title>
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#0f172a">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.2/dist/sql-wasm.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/themes/light.css">

<!-- كود اكتشاف الأخطاء (سيظهر لك نافذة تنبيه إذا كان هناك ملف ناقص) -->
<script>
  window.onerror = function(msg, url, line) {
    alert("⚠️ حدث خطأ برمجي!\nالرسالة: " + msg + "\nالملف: " + url + "\nالسطر: " + line);
    return false;
  };
</script>
</head>
<body class="bg-gray-900 text-gray-100">

<!-- مكتبة الألوان والتدرجات للعدادات -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <linearGradient id="metalTrack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
</svg>

<div id="dbStatus"><span class="spinner" style="width:12px;height:12px;border-width:2px"></span> <span id="dbStatusText">جاري تحميل القاعدة...</span></div>

<section class="relative pt-10 pb-12 px-4 border-b border-gray-800/50 text-center">
  <div class="inline-flex items-center gap-2 bg-blue-500/10 border border-blue-500/30 rounded-full px-3 py-1.5 text-[11px] font-bold text-blue-400 mb-5">
    <span class="pro-badge">PRO</span>
    <span>CheckDiga</span>
  </div>
  <h1 class="text-3xl font-extrabold mb-3">افحص سيارتك من هاتفك<span class="block bg-gradient-to-l from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">الآن</span></h1>
  <div class="my-6">
    <div class="hero-number text-6xl md:text-7xl font-black bg-gradient-to-l from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent leading-none" id="heroCount">10,098</div>
    <div class="text-sm text-gray-400 font-bold mt-2 tracking-wider">كود عطل في القاعدة</div>
  </div>
</section>

<div id="app" class="max-w-6xl mx-auto p-3 space-y-4 pt-6">
<div class="flex justify-between items-center flex-wrap gap-2">
  <h1 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-wrench text-blue-400"></i> CheckDiga <span class="pro-badge">PRO</span></h1>
</div>

<header class="bg-gray-800 p-4 rounded-2xl">
<div class="flex items-center gap-3 mb-3">
<div id="statusDot" class="w-3 h-3 rounded-full bg-red-500"></div>
<div class="flex-1">
<p id="connection-status" class="text-sm font-bold text-red-400">غير متصل</p>
<p id="vin-display" class="text-xs text-gray-500">VIN: --</p>
</div>
</div>
<div class="grid grid-cols-3 gap-2 mb-2">
<button id="connect-btn" class="bg-blue-600 text-white px-3 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2"><i class="fa-brands fa-bluetooth-b"></i> Bluetooth</button>
<button id="usb-btn" class="bg-emerald-600 text-white px-3 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2"><i class="fa-solid fa-usb"></i> USB</button>
<button id="demo-btn" class="bg-amber-600 text-white px-3 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2"><i class="fa-solid fa-flask"></i> تجريبي</button>
</div>
<button id="disconnect-btn" class="hidden w-full bg-red-600 text-white px-3 py-2.5 rounded-xl text-sm font-bold mb-2"><i class="fa-solid fa-plug-circle-xmark"></i> قطع الاتصال</button>
<button id="clear-btn" class="w-full bg-red-700 text-white px-3 py-2.5 rounded-xl text-sm font-bold mb-2"><i class="fa-solid fa-trash"></i> مسح الأعطال</button>
</header>

<div class="flex gap-2 overflow-x-auto scrollbar-thin pb-1">
<button class="tab bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap" data-tab="faults">الأعطال</button>
<button class="tab bg-gray-800 text-gray-400 px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap" data-tab="search">بحث</button>
<button class="tab bg-gray-800 text-gray-400 px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap" data-tab="favorites">المفضلة</button>
</div>

<div id="console" class="bg-black text-green-400 p-3 rounded-xl font-mono text-xs max-h-32 overflow-y-auto scrollbar-thin" style="direction:ltr;text-align:left">&gt; جاهز!</div>

<!-- قسم الأعطال -->
<div id="panel-faults" class="panel space-y-4">
<div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-4 space-y-4">
<div class="grid grid-cols-2 gap-4 min-h-[350px] md:min-h-[450px]">
<!-- العدادات -->
<div class="gauge-box"><div class="gauge-title">RPM</div><svg viewBox="0 0 200 200" class="w-full h-full"><path d="M 30 130 A 70 70 0 1 1 170 130" fill="none" stroke="url(#metalTrack)" stroke-width="12" stroke-linecap="round"/><path id="rpmArc" class="gauge-arc" d="M 30 130 A 70 70 0 1 1 170 130" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220"/><g class="gauge-needle" id="rpmNeedle"><polygon points="96,100 104,100 100,115" fill="#1e293b"/><polygon points="97,100 103,100 100,25" fill="#ef4444"/><circle cx="100" cy="100" r="9" fill="#0f172a" stroke="#64748b" stroke-width="2"/><circle cx="100" cy="100" r="3" fill="#cbd5e1"/></g></svg><div class="gauge-value-box"><div class="gauge-value" id="gauge-rpm">0</div><div class="gauge-unit">x1000</div></div></div>
<div class="gauge-box"><div class="gauge-title">SPEED</div><svg viewBox="0 0 200 200" class="w-full h-full"><path d="M 30 130 A 70 70 0 1 1 170 130" fill="none" stroke="url(#metalTrack)" stroke-width="12" stroke-linecap="round"/><path id="spdArc" class="gauge-arc" d="M 30 130 A 70 70 0 1 1 170 130" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220"/><g class="gauge-needle" id="spdNeedle"><polygon points="96,100 104,100 100,115" fill="#1e293b"/><polygon points="97,100 103,100 100,25" fill="#3b82f6"/><circle cx="100" cy="100" r="9" fill="#0f172a" stroke="#64748b" stroke-width="2"/><circle cx="100" cy="100" r="3" fill="#cbd5e1"/></g></svg><div class="gauge-value-box"><div class="gauge-value" id="gauge-speed">0</div><div class="gauge-unit">km/h</div></div></div>
<div class="gauge-box"><div class="gauge-title">TEMP</div><svg viewBox="0 0 200 200" class="w-full h-full"><path d="M 30 130 A 70 70 0 1 1 170 130" fill="none" stroke="url(#metalTrack)" stroke-width="12" stroke-linecap="round"/><path id="colArc" class="gauge-arc" d="M 30 130 A 70 70 0 1 1 170 130" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220"/><g class="gauge-needle" id="colNeedle"><polygon points="96,100 104,100 100,115" fill="#1e293b"/><polygon points="97,100 103,100 100,25" fill="#f59e0b"/><circle cx="100" cy="100" r="9" fill="#0f172a" stroke="#64748b" stroke-width="2"/><circle cx="100" cy="100" r="3" fill="#cbd5e1"/></g></svg><div class="gauge-value-box"><div class="gauge-value" id="gauge-coolant">0</div><div class="gauge-unit">°C</div></div></div>
<div class="gauge-box"><div class="gauge-title">FUEL</div><svg viewBox="0 0 200 200" class="w-full h-full"><path d="M 30 130 A 70 70 0 1 1 170 130" fill="none" stroke="url(#metalTrack)" stroke-width="12" stroke-linecap="round"/><path id="fuelArc" class="gauge-arc" d="M 30 130 A 70 70 0 1 1 170 130" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220"/><g class="gauge-needle" id="fuelNeedle"><polygon points="96,100 104,100 100,115" fill="#1e293b"/><polygon points="97,100 103,100 100,25" fill="#10b981"/><circle cx="100" cy="100" r="9" fill="#0f172a" stroke="#64748b" stroke-width="2"/><circle cx="100" cy="100" r="3" fill="#cbd5e1"/></g></svg><div class="gauge-value-box"><div class="gauge-value" id="gauge-fuel">0</div><div class="gauge-unit">%</div></div></div>
</div>

<!-- أضواء الطابلون -->
<div class="grid grid-cols-5 gap-2 pt-4 border-t border-gray-700/50 mt-4">
<div class="sys-item" data-sys="engine"><i class="fa-solid fa-gear text-lg"></i><span class="text-[9px] font-bold">المحرك</span></div>
<div class="sys-item" data-sys="transmission"><i class="fa-solid fa-cogs text-lg"></i><span class="text-[9px] font-bold">الجير</span></div>
<div class="sys-item" data-sys="abs"><i class="fa-solid fa-circle-exclamation text-lg"></i><span class="text-[9px] font-bold">ABS</span></div>
<div class="sys-item" data-sys="brakes"><i class="fa-solid fa-hand text-lg"></i><span class="text-[9px] font-bold">فرامل</span></div>
<div class="sys-item" data-sys="airbag"><i class="fa-solid fa-shield-halved text-lg"></i><span class="text-[9px] font-bold">وسائد</span></div>
<div class="sys-item" data-sys="fuel"><i class="fa-solid fa-gas-pump text-lg"></i><span class="text-[9px] font-bold">وقود</span></div>
<div class="sys-item" data-sys="exhaust"><i class="fa-solid fa-smog text-lg"></i><span class="text-[9px] font-bold">عوادم</span></div>
<div class="sys-item" data-sys="cooling"><i class="fa-solid fa-temperature-half text-lg"></i><span class="text-[9px] font-bold">تبريد</span></div>
<div class="sys-item" data-sys="battery"><i class="fa-solid fa-car-battery text-lg"></i><span class="text-[9px] font-bold">بطارية</span></div>
<div class="sys-item" data-sys="electronics"><i class="fa-solid fa-bolt text-lg"></i><span class="text-[9px] font-bold">كهرباء</span></div>
</div>
</div>

<div class="bg-gray-800 rounded-2xl p-4 space-y-3">
<h3 class="text-base font-bold"><i class="fa-solid fa-triangle-exclamation text-red-400"></i> أكواد الأعطال</h3>
<div class="grid grid-cols-2 gap-2">
<button id="btnReadDTC" class="bg-amber-600 text-white px-3 py-2.5 rounded-xl text-sm font-bold">فحص المحرك</button>
<button id="btnScanAll" class="bg-emerald-600 text-white px-3 py-2.5 rounded-xl text-sm font-bold">فحص الكل</button>
<button id="btnScanABS" class="bg-purple-600 text-white px-3 py-2.5 rounded-xl text-sm font-bold col-span-2">فحص ABS / Airbag / BCM</button>
</div>
<div id="dtcList" class="space-y-2 text-sm"><p class="text-gray-500 text-center py-4">لم يتم الفحص بعد.</p></div>
</div>
</div>

<!-- قسم البحث -->
<div id="panel-search" class="panel hidden space-y-4">
  <div class="bg-gray-800 rounded-2xl p-4 space-y-3">
    <h3 class="font-bold">البحث</h3>
    <input type="text" id="dtcSearchInput" class="w-full bg-gray-900 border-2 border-gray-700 rounded-xl px-3 py-3 text-sm outline-none" placeholder="ابحث عن كود...">
    <div id="searchResults"></div>
  </div>
</div>

<!-- قسم المفضلة -->
<div id="panel-favorites" class="panel hidden space-y-4">
  <div class="bg-gray-800 rounded-2xl p-4 space-y-3">
    <h3 class="font-bold">المفضلة</h3>
    <div id="favoritesList"></div>
  </div>
</div>

</div>

<!-- نافذة تفاصيل العطل -->
<div id="dtcDetailModal" class="hidden fixed inset-0 bg-black/80 z-50 p-4 overflow-y-auto modal-backdrop">
<div class="max-w-2xl mx-auto mt-6 bg-gray-800 rounded-2xl p-5 relative modal-content">
<button id="btnCloseDetail" class="absolute top-3 right-3 bg-red-600 text-white w-8 h-8 rounded-full text-sm font-bold">×</button>
<div id="dtcDetailContent" class="pt-2"></div>
</div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
