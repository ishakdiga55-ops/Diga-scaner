<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>أداة تقسيم قاعدة البيانات</title>
<style>body{font-family:Cairo,sans-serif;padding:20px;background:#f1f5f9;}
button{padding:15px 30px;font-size:16px;background:#3b82f6;color:#fff;border:none;border-radius:10px;cursor:pointer;margin:5px;}
button:hover{background:#2563eb;}
pre{background:#0f172a;color:#4ade80;padding:15px;border-radius:10px;overflow:auto;max-height:400px;}</style>
</head>
<body>
<h1>🔧 أداة تقسيم قاعدة البيانات</h1>
<p>تضع ملفك القديم، وتحمّل 5 ملفات جديدة مقسمة ومضغوطة.</p>
<button onclick="split()">🚀 ابدأ التقسيم</button>
<pre id="output">اضغط الزر لبدء العملية...</pre>

<script>
async function split() {
  const out = document.getElementById('output');
  out.textContent = 'جاري تحميل الملف القديم...\n';
  
  // حمّل الملف القديم
  const response = await fetch('dtc_database.json');
  const oldData = await response.json();
  out.textContent += `تم تحميل ${Object.keys(oldData).length} كود\n\n`;
  
  // ضغط وتقسيم
  const buckets = { P: {}, C: {}, B: {}, U: {} };
  for (const [code, info] of Object.entries(oldData)) {
    const letter = code[0].toUpperCase();
    if (!buckets[letter]) buckets[letter] = {};
    buckets[letter][code] = [info.zone || 'engine', info.title || '', info.desc || ''];
  }
  
  // اختر الأكواد الأكثر شيوعاً للـ Core
  const commonCodes = ['P0171','P0172','P0174','P0175','P0300','P0301','P0302','P0303','P0304','P0305',
    'P0306','P0307','P0308','P0420','P0430','P0440','P0442','P0455','P0456','P0500','P0505','P0562',
    'P0563','P0601','P0606','P0700','P0730','P0741','P0750','P0755','C0035','C0040','C0045','C0050',
    'B0001','B0012','B0013','B0100','B1000','U0100','U0101','U0121','U0155','P0010','P0011','P0016',
    'P0017','P0101','P0102','P0103','P0115','P0118','P0128','P0130','P0135','P0141','P0325','P0335',
    'P0340','P0351','P0352'];
  
  const core = {};
  for (const code of commonCodes) {
    if (oldData[code]) core[code] = [oldData[code].zone, oldData[code].title, oldData[code].desc];
  }
  
  // أنشئ الروابط
  const files = { 'dtc_core.json': core, ...buckets };
  
  out.textContent += '📊 إحصائيات الملفات:\n';
  out.textContent += `- dtc_core.json: ${Object.keys(core).length} كود\n`;
  for (const [letter, data] of Object.entries(buckets)) {
    out.textContent += `- dtc_${letter.toLowerCase()}.json: ${Object.keys(data).length} كود\n`;
  }
  out.textContent += '\n⬇️ جاري تنزيل الملفات...\n\n';
  
  // نزّل كل ملف
  let i = 0;
  for (const [filename, data] of Object.entries(files)) {
    await new Promise(r => setTimeout(r, 500));
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    out.textContent += `✅ تم تنزيل: ${filename}\n`;
    i++;
  }
  
  out.textContent += '\n🎉 اكتمل! ارفع الملفات الخمسة إلى GitHub.';
}
</script>
</body>
</html>
