<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Toast Test</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
<h1 class="text-2xl mb-6">اختبار Toast</h1>
<button id="btn1" class="bg-blue-600 px-4 py-2 rounded mb-2 block">Toast Info</button>
<button id="btn2" class="bg-emerald-600 px-4 py-2 rounded mb-2 block">Toast Success</button>
<button id="btn3" class="bg-amber-600 px-4 py-2 rounded mb-2 block">Toast Warn</button>
<button id="btn4" class="bg-red-600 px-4 py-2 rounded mb-2 block">Toast Error</button>

<script>
function toast(msg, type) {
  type = type || 'info';
  const colors = {
    info: '#2563eb',
    success: '#059669',
    warn: '#d97706',
    error: '#dc2626'
  };
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 
    'position:fixed;' +
    'top:20px; function' +
    'left:50%;' +
    'transform:translateX(-50%);' +
    'background:' + colors[type] + ';' +
    'color:white;' +
    'padding:14px 22px;' +
    'border-radius:12px;' +
    'font-weight:bold;' +
    'font-size:15px;' +
    'z-index:99999;' +
    'box-shadow:0 10px 30px rgba(0,0,0,0.5);' +
    'font-family:Arial,sans-serif;';
  document.body.appendChild(el);
  setTimeout(function() {
    el.style.transition = 'opacity 0.3s';
    el.style.opacity = '0';
    setTimeout(function() { el.remove(); }, 300);
  }, 2500);
}

document.getElementById('btn1').onclick = function() { toast('رسالة معلومات', 'info'); };
document.getElementById('btn2').onclick = function() { toast('نجح!', 'success'); };
document.getElementById('btn3').onclick =() { toast('تحذير', 'warn'); };
document.getElementById('btn4').onclick = function() { toast('خطأ', 'error'); };
</script>
</body>
</html>
