<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار — CheckDiga</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-4">

<h1 class="text-2xl font-bold mb-4">🧪 اختبار الملفات الجديدة</h1>

<div id="result" class="bg-gray-800 p-4 rounded-xl space-y-2 text-sm">
  <div>جاري التحميل...</div>
</div>

<pre id="log" class="bg-black text-green-400 p-3 rounded-xl mt-4 text-xs overflow-auto" style="direction:ltr;text-align:left;max-height:400px"></pre>

<script type="module">
const out = document.getElementById('result');
const log = document.getElementById('log');
function L(msg, ok) {
  log.textContent += '\n' + (ok ? '✅' : '❌') + ' ' + msg;
  console.log(msg);
}

try {
  L('تحميل state.js...');
  const state = await import('./js/state.js');
  L('state.js: ' + Object.keys(state).join(', '), true);

  L('تحميل obd.js...');
  const obd = await import('./js/obd.js');
  L('obd.js: ' + Object.keys(obd).join(', '), true);

  L('تحميل analysis.js...');
  const analysis = await import('./js/analysis.js');
  L('analysis.js: ' + Object.keys(analysis).join(', '), true);

  L('تحميل obd-commands.js...');
  const cmd = await import('./js/obd-commands.js');
  L('obd-commands.js: ' + Object.keys(cmd).join(', '), true);

  L('تحميل ui-extras.js...');
  const ui = await import('./js/ui-extras.js');
  L('ui-extras.js: ' + Object.keys(ui).join(', '), true);

  L('تحميل extras.js...');
  const ex = await import('./js/extras.js');
  L('extras.js: ' + Object.keys(ex).join(', '), true);

  L('تحميل data/database.js...');
  const db = await import('./js/data/database.js');
  L('database.js: ' + Object.keys(db).join(', '), true);

  L('تحميل data/loader.js...');
  const ld = await import('./js/data/loader.js');
  L('loader.js: ' + Object.keys(ld).join(', '), true);

  L('تحميل ui/theme.js...');
  const th = await import('./js/ui/theme.js');
  L('theme.js: ' + Object.keys(th).join(', '), true);

  L('تحميل ui/search.js...');
  const se = await import('./js/ui/search.js');
  L('search.js: ' + Object.keys(se).join(', '), true);

  out.innerHTML = '<div class="text-green-400 font-bold text-lg">✅ كل الملفات تعمل بشكل صحيح!</div>';

} catch(e) {
  L('خطأ: ' + e.message, false);
  out.innerHTML = '<div class="text-red-400 font-bold">❌ ' + e.message + '</div><pre class="text-xs mt-2">' + (e.stack || '') + '</pre>';
}
</script>

</body>
</html>
